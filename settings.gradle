pluginManagement {
    repositories {
        // 本地预下载仓库（mercury/lorenz-tiny 已完整）
        maven { url 'file:///Y:/waaous-addon/maven-local' }
        // 国内镜像源
        maven { url 'https://maven.aliyun.com/repository/public/' }
        maven { url 'https://bmclapi2.bangbang93.com/maven' }
        mavenCentral()
        // 备用：fabric 官方 maven（仅 net.fabricmc 构件）
        maven {
            url 'https://maven.fabricmc.net/'
            content { includeGroupByRegex "net\\.fabricmc(\\..*)?" }
        }
    }
}

rootProject.name = "waaous-addon"
