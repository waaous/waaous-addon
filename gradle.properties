org.gradle.jvmargs=-Xmx2G -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

# 本地 JDK 21，供 java.toolchain 使用，避免 foojay 联网下载
org.gradle.java.installations.paths=E:/jdk-21.0.4

# fabric maven 在并行下载时可能变慢，放宽 HTTP 超时避免 Read timed out
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=180000

minecraft_version=1.21.11
loader_version=0.19.3
loom_version=1.17.19

version=0.1.0
group=com.waaous
archives_base_name=waaous-addon
